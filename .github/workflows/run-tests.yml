name: Run tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-dependencies:
    if: ${{ !(github.event.pull_request.head.repo.fork) }}
    name: Current AI dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: >-
          uv pip install . pydantic-ai anthropic openai fastmcp
          chromadb dirty-equals pytest pytest-asyncio pytest-env
          pytest-xdist pytest-timeout
      - run: .venv/bin/python -m pytest tests/basic --ignore=tests/basic/memory -q

  run_tests:
    # Skip the entire job for fork PRs
    if: ${{ !(github.event.pull_request.head.repo.fork) }}
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Marvin
        run: uv sync

      - name: Download Chroma embedding model before starting parallel workers
        run: uv run --frozen python -c 'from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(["initialize embedding model"])'

      - name: Run tests
        run: uv run --frozen pytest -v -n auto
