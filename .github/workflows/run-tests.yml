name: Run tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-dependencies:
    if: ${{ !(github.event.pull_request.head.repo.fork) }}
    name: Current AI dependencies on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          uv pip install . pydantic-ai anthropic openai fastmcp
          chromadb "qdrant-client[fastembed]" dirty-equals pytest pytest-asyncio pytest-env
          pytest-xdist pytest-timeout
      - name: Download embedding models before running memory tests
        run: |
          .venv/bin/python -c 'from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(["initialize embedding model"])'
          .venv/bin/python -c 'from fastembed import TextEmbedding; next(TextEmbedding(model_name="BAAI/bge-small-en").embed(["initialize embedding model"]))'
      - run: .venv/bin/python -m pytest tests/basic -q

  run_tests:
    # Skip the entire job for fork PRs
    if: ${{ !(github.event.pull_request.head.repo.fork) }}
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Marvin
        run: uv sync

      - name: Download embedding models before starting parallel workers
        run: |
          uv run --frozen python -c 'from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(["initialize embedding model"])'
          uv run --frozen python -c 'from fastembed import TextEmbedding; next(TextEmbedding(model_name="BAAI/bge-small-en").embed(["initialize embedding model"]))'

      - name: Run tests
        run: uv run --frozen pytest -v -n auto
